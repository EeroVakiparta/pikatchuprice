<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd43b">
<title>PikatchuPrice</title>
<meta name="description" content="Electricity spot price now, today and tomorrow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #f6f4ee; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e6e2d8;
    --accent: #ffd43b; --cheap: #2e9e5b; --mid: #e0a100; --high: #d64545;
    --cheap-bg: #e4f5ea; --mid-bg: #fdf3d3; --high-bg: #fbe3e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1f1f23; --ink: #f2f2f4; --muted: #9a9aa2; --line: #2e2e34;
      --cheap: #4cc27d; --mid: #f0b92a; --high: #ef6a6a;
      --cheap-bg: #173323; --mid-bg: #3a2f10; --high-bg: #3d1b1b;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 480px; margin: 0 auto; padding: 12px 16px 32px; }
  header { display: flex; align-items: center; gap: 10px; padding: 4px 0 12px; }
  header img { width: 36px; height: 36px; border-radius: 9px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; flex: 1; }
  header .wx { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }

  /* now */
  .now { text-align: center; padding: 22px 16px 18px; }
  .now .label { font-size: 13px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .now .price { font-size: 68px; font-weight: 800; line-height: 1.05; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  .now .unit { font-size: 15px; color: var(--muted); }
  .pill { display: inline-block; margin-top: 12px; padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .lv-cheap .pill { background: var(--cheap-bg); color: var(--cheap); }
  .lv-mid .pill { background: var(--mid-bg); color: var(--mid); }
  .lv-high .pill { background: var(--high-bg); color: var(--high); }
  .lv-cheap .price { color: var(--cheap); } .lv-mid .price { color: var(--mid); } .lv-high .price { color: var(--high); }
  .now .next { margin-top: 12px; font-size: 14px; color: var(--muted); }

  /* chart */
  .tabs { display: flex; gap: 6px; background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 650; font-size: 14px;
    padding: 8px 0; border-radius: 9px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tabs button:disabled { opacity: .45; cursor: default; }
  .readout { display: flex; justify-content: space-between; align-items: baseline; min-height: 26px; margin-bottom: 6px; }
  .readout .t { font-size: 14px; color: var(--muted); }
  .readout .p { font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 170px; touch-action: pan-y; }
  .bar { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: pointer; position: relative; }
  .bar .tag { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 750; white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
  .bar.cheap .tag { color: var(--cheap); } .bar.mid .tag { color: var(--mid); } .bar.high .tag { color: var(--high); }
  .bar.marked.past i { opacity: .6; }
  .bar i { display: block; width: 100%; border-radius: 4px 4px 1px 1px; min-height: 3px; }
  .bar.cheap i { background: var(--cheap); } .bar.mid i { background: var(--mid); } .bar.high i { background: var(--high); }
  .bar.past i { opacity: .35; }
  .bar.cur i { outline: 2px solid var(--ink); outline-offset: 1px; }
  .bar.sel i { filter: brightness(1.15); outline: 2px solid var(--ink); outline-offset: 1px; }
  .axis { display: flex; gap: 3px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .axis span { flex: 1; text-align: center; overflow: visible; white-space: nowrap; }
  .stats { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .stats b { display: block; color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
  .empty { height: 170px; display: grid; place-items: center; color: var(--muted); font-size: 14px; text-align: center; }

  /* weather */
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  h2 small { font-weight: 500; font-size: 12px; color: var(--muted); }
  .wxstrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .wxstrip::-webkit-scrollbar { display: none; }
  .wxh { flex: 0 0 54px; text-align: center; background: var(--bg); border-radius: 12px; padding: 8px 0; font-variant-numeric: tabular-nums; }
  .wxh .h { font-size: 12px; color: var(--muted); }
  .wxh .i { font-size: 22px; line-height: 1.3; }
  .wxh .t { font-size: 15px; font-weight: 700; }
  .wxh .w { font-size: 11px; color: var(--muted); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; }
  .days .d { font-size: 12px; color: var(--muted); }
  .days .i { font-size: 20px; line-height: 1.4; }
  .days .hi { font-size: 14px; font-weight: 700; }
  .days .lo { font-size: 12px; color: var(--muted); }

  /* fuel */
  .sample { background: var(--mid-bg); color: var(--mid); border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
  .st { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .st:first-of-type { border-top: 0; }
  .st .n { flex: 1; min-width: 0; }
  .st .n b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st .n span { font-size: 12px; color: var(--muted); }
  .st .p { font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; }
  .st .p small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .st.best .p { color: var(--cheap); }

  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 16px; }
  footer button { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer; margin-bottom: 8px; }
  footer a { color: inherit; }
  .err { color: var(--high); text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.png" alt="">
    <h1>PikatchuPrice</h1>
    <span class="wx" id="wx"></span>
  </header>

  <section class="card now" id="now">
    <div class="label">Electricity now</div>
    <div class="price" id="nowPrice">–</div>
    <div class="unit">c/kWh</div>
    <div><span class="pill" id="nowPill">Loading…</span></div>
    <div class="next" id="nowNext"></div>
  </section>

  <section class="card">
    <div class="tabs" role="tablist">
      <button id="tabToday" role="tab" aria-selected="true">Today</button>
      <button id="tabTomorrow" role="tab" aria-selected="false">Tomorrow</button>
    </div>
    <div class="readout"><span class="t" id="roTime"></span><span class="p" id="roPrice"></span></div>
    <div id="chart"></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card" id="wxCard" hidden>
    <h2>Weather <small>Tampere</small></h2>
    <div class="wxstrip" id="wxHours"></div>
    <div class="days" id="wxDays"></div>
  </section>

  <section class="card">
    <h2>Fuel nearby <small id="fuelNote"></small></h2>
    <div class="sample" id="fuelSample" hidden>Fuel prices are not available right now.</div>
    <div class="tabs" role="tablist" id="fuelTabs">
      <button data-f="95E10" aria-selected="false">95</button>
      <button data-f="98E5" aria-selected="true">98</button>
      <button data-f="Diesel" aria-selected="false">Diesel</button>
    </div>
    <div id="fuelList"></div>
  </section>

  <footer>
    <button id="refresh">Refresh</button>
    <div id="updated"></div>
    <div><span id="ver"></span><a href="https://github.com/EeroVakiparta/pikatchuprice">GitHub</a></div>
  </footer>
</main>

<script>
const API = 'https://r8carkxrn0.execute-api.eu-north-1.amazonaws.com/prod/';
const CHEAP_MAX = 5, MID_MAX = 12;           // c/kWh thresholds for green / yellow / red
const HOUR = 3600e3;
const $ = id => document.getElementById(id);
const level = p => p <= CHEAP_MAX ? 'cheap' : p <= MID_MAX ? 'mid' : 'high';
const LEVEL_TEXT = { cheap: 'Cheap', mid: 'Normal', high: 'Expensive' };
const fmt = p => p.toFixed(p < 10 ? 2 : 1).replace('.', ',');
const hh = ts => String(new Date(ts).getHours()).padStart(2, '0');
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };

let hours = [], view = 'today', selected = null;

async function load() {
  try {
    const res = await fetch(API, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    hours = raw.map(r => ({ t: r.timestamp, p: r.price })).sort((a, b) => a.t - b.t);
    render();
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    $('nowPill').textContent = 'Could not load prices';
    $('chart').innerHTML = '<div class="err">Price service did not answer. Try Refresh.</div>';
  }
}

function render() {
  const now = Date.now();
  const cur = hours.find(h => h.t <= now && now < h.t + HOUR);

  // --- now card
  const card = $('now');
  card.className = 'card now';
  if (cur) {
    const lv = level(cur.p);
    card.classList.add('lv-' + lv);
    $('nowPrice').textContent = fmt(cur.p);
    $('nowPill').textContent = LEVEL_TEXT[lv];
    const nxt = hours.find(h => h.t === cur.t + HOUR);
    if (nxt) {
      const d = nxt.p - cur.p;
      const arrow = Math.abs(d) < 0.3 ? '→ stays about the same' : d > 0 ? '↑ rises to ' + fmt(nxt.p) : '↓ falls to ' + fmt(nxt.p);
      $('nowNext').textContent = arrow + ' at ' + hh(nxt.t) + ':00';
    } else $('nowNext').textContent = '';
  } else {
    $('nowPrice').textContent = '–';
    $('nowPill').textContent = 'No price for this hour';
    $('nowNext').textContent = '';
  }

  // --- tabs
  const tomorrowKey = dayKey(now + 24 * HOUR);
  const hasTomorrow = hours.filter(h => dayKey(h.t) === tomorrowKey).length >= 12;
  $('tabTomorrow').disabled = !hasTomorrow;
  $('tabTomorrow').textContent = hasTomorrow ? 'Tomorrow' : 'Tomorrow · ~14:00';
  if (!hasTomorrow && view === 'tomorrow') view = 'today';
  $('tabToday').setAttribute('aria-selected', view === 'today');
  $('tabTomorrow').setAttribute('aria-selected', view === 'tomorrow');

  renderChart(view === 'today' ? dayKey(now) : tomorrowKey, cur);
}

function renderChart(key, cur) {
  const day = hours.filter(h => dayKey(h.t) === key);
  const chart = $('chart');
  if (!day.length) { chart.innerHTML = '<div class="empty">No prices for this day yet.</div>'; $('stats').innerHTML = ''; return; }
  const now = Date.now();
  const max = Math.max(10, ...day.map(h => h.p)) / 0.86;          // headroom for the labels
  const lo = day.reduce((m, h) => h.p < m.p ? h : m), hi = day.reduce((m, h) => h.p > m.p ? h : m);
  const bars = day.map(h => {
    const cls = ['bar', level(h.p)];
    if (h.t + HOUR <= now) cls.push('past');
    if (cur && h.t === cur.t) cls.push('cur');
    if (selected === h.t) cls.push('sel');
    const pct = Math.max(0, h.p) / max * 100;
    const tag = h === lo || h === hi ? `<b class="tag" style="bottom:calc(${pct}% + 5px)">${h.p.toFixed(1).replace('.', ',')}</b>` : '';
    if (tag) cls.push('marked');
    return `<div class="${cls.join(' ')}" data-t="${h.t}">${tag}<i style="height:${pct}%"></i></div>`;
  }).join('');
  const axis = day.map(h => `<span>${new Date(h.t).getHours() % 3 === 0 ? hh(h.t) : ''}</span>`).join('');
  chart.innerHTML = `<div class="bars">${bars}</div><div class="axis">${axis}</div>`;

  const sel = day.find(h => h.t === selected) || (cur && day.find(h => h.t === cur.t)) || null;
  if (sel) {
    $('roTime').textContent = hh(sel.t) + ':00–' + hh(sel.t + HOUR) + ':00' + (cur && sel.t === cur.t ? ' · now' : '');
    $('roPrice').textContent = fmt(sel.p) + ' c/kWh';
  } else { $('roTime').textContent = 'Tap a bar for the hour'; $('roPrice').textContent = ''; }

  const ps = day.map(h => h.p);
  const avg = ps.reduce((a, b) => a + b, 0) / ps.length;
  $('stats').innerHTML =
    `<div>Lowest<b>${fmt(lo.p)}</b>at ${hh(lo.t)}</div>` +
    `<div style="text-align:center">Average<b>${fmt(avg)}</b>c/kWh</div>` +
    `<div style="text-align:right">Highest<b>${fmt(hi.p)}</b>at ${hh(hi.t)}</div>`;
}

function pick(e) {
  const bar = e.target.closest('.bar');
  if (!bar) return;
  selected = Number(bar.dataset.t);
  render();
}
$('chart').addEventListener('click', pick);
$('chart').addEventListener('pointermove', e => { if (e.pointerType !== 'mouse' || e.buttons) pick(e); });
$('tabToday').onclick = () => { view = 'today'; selected = null; render(); };
$('tabTomorrow').onclick = () => { view = 'tomorrow'; selected = null; render(); };
$('refresh').onclick = load;

const wxIcon = code => code === 0 ? '☀️' : code <= 3 ? '⛅' : code <= 48 ? '🌫️' : code <= 67 ? '🌧️' : code <= 77 ? '❄️' : code <= 82 ? '🌦️' : code <= 86 ? '🌨️' : '⛈️';
const deg = t => { t = Math.round(t); return (t > 0 ? '+' : '') + t + '°'; };

async function weather() {
  try {
    const u = 'https://api.open-meteo.com/v1/forecast?latitude=61.5&longitude=23.79&timezone=Europe%2FHelsinki&wind_speed_unit=ms&forecast_days=7'
      + '&current=temperature_2m,weather_code'
      + '&hourly=temperature_2m,weather_code,wind_speed_10m'
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min';
    const w = await (await fetch(u)).json();
    $('wx').textContent = `${wxIcon(w.current.weather_code)} ${deg(w.current.temperature_2m)} Tampere`;

    const H = w.hourly, start = Math.max(0, H.time.findIndex(t => new Date(t).getTime() + HOUR > Date.now()));
    $('wxHours').innerHTML = H.time.slice(start, start + 12).map((t, k) => {
      const i = start + k;
      return `<div class="wxh"><div class="h">${k === 0 ? 'Now' : t.slice(11, 13)}</div><div class="i">${wxIcon(H.weather_code[i])}</div>`
        + `<div class="t">${deg(H.temperature_2m[i])}</div><div class="w">${Math.round(H.wind_speed_10m[i])} m/s</div></div>`;
    }).join('');

    const D = w.daily;
    $('wxDays').innerHTML = D.time.map((t, i) =>
      `<div><div class="d">${i === 0 ? 'Today' : new Date(t + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short' })}</div>`
      + `<div class="i">${wxIcon(D.weather_code[i])}</div><div class="hi">${deg(D.temperature_2m_max[i])}</div><div class="lo">${deg(D.temperature_2m_min[i])}</div></div>`).join('');
    $('wxCard').hidden = false;
  } catch (e) { /* weather is optional */ }
}

// ---- fuel: same response shape as the repo's fetchFuelPrices Lambda ({ stations: [...] })
const FUEL_API = 'https://6dg6a1i64i.execute-api.eu-north-1.amazonaws.com/prod/';
let stations = [], fuelType = '98E5';

function ago(iso) {
  if (!iso) return '';
  const h = (Date.now() - new Date(iso).getTime()) / HOUR;
  return h < 1 ? 'just now' : h < 24 ? Math.round(h) + ' h ago' : Math.round(h / 24) + ' d ago';
}

function renderFuel() {
  const rows = stations.filter(s => s.prices && s.prices[fuelType]).sort((a, b) => a.prices[fuelType].price - b.prices[fuelType].price).slice(0, 5);
  $('fuelList').innerHTML = rows.length ? rows.map((s, i) => {
    const pr = s.prices[fuelType], km = s.distance >= 1000 ? (s.distance / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(s.distance) + ' m';
    return `<div class="st${i === 0 ? ' best' : ''}"><div class="n"><b>${s.brand} ${s.name}</b><span>${km}</span></div>`
      + `<div class="p">${pr.price.toFixed(3).replace('.', ',')} €<small>${ago(pr.updated)}</small></div></div>`;
  }).join('') : '<div class="empty" style="height:80px">No stations with this fuel nearby.</div>';
  for (const b of $('fuelTabs').children) b.setAttribute('aria-selected', b.dataset.f === fuelType);
}

async function fuel() {
  let ok = false;
  try {
    const r = await fetch(FUEL_API + '?latitude=61.5&longitude=23.79&radius=5000');
    if (r.ok) {
      const data = await r.json();
      // the service reports distance in km
      stations = (data.stations || []).map(s => ({ ...s, distance: (s.distance || 0) * 1000 }));
      ok = stations.length > 0;
    }
  } catch (e) { /* shown as unavailable below */ }
  $('fuelSample').hidden = ok;
  $('fuelTabs').hidden = !ok;
  $('fuelList').hidden = !ok;
  $('fuelNote').textContent = ok ? 'cheapest first' : '';
  if (ok) renderFuel();
}
$('fuelTabs').onclick = e => { const b = e.target.closest('button'); if (b) { fuelType = b.dataset.f; renderFuel(); } };

async function version() {
  try {
    const v = await (await fetch('version.json', { cache: 'no-store' })).json();
    $('ver').textContent = 'v' + v.version + ' · ';
  } catch (e) { /* optional */ }
}

load(); weather(); fuel(); version();
setInterval(() => { if (hours.length) render(); }, 60e3);       // keep "now" on the right hour
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
